name: build-windows-vst3
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (VS 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build core tests
        run: cmake --build build --config Release --target LumivoreCoreTests --parallel

      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build VST3
        run: cmake --build build --config Release --target Lumivore_VST3 --parallel

      - name: Developer prompt (for dumpbin)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify bundle and dependencies
        shell: pwsh
        run: |
          $dll = "build/Lumivore_artefacts/Release/VST3/Lumivore.vst3/Contents/x86_64-win/Lumivore.vst3"
          if (-not (Test-Path $dll)) { throw "VST3 binary missing: $dll" }
          dumpbin /dependents $dll | Tee-Object -FilePath dependents.txt
          if (Select-String -Path dependents.txt -Pattern 'VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase') {
            throw "Plugin depends on the VC++/UCRT runtime (static runtime expected)"
          }

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Lumivore-Windows-x64
          path: |
            Lumivore-Windows-x64.zip
            release/
